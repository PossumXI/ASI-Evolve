# Immaculate route-policy experiment
# ==================================
# Evolves the policy that orders Immaculate's governed fallback providers per TaskClass x ComplexityBand,
# scored by replaying measured outcomes (evaluator.py). Every LLM call the evolution loop makes goes
# through the Immaculate Q gateway, so it is governed by the Immaculate Route and sealed into the LaaS
# decision ledger, exactly like the arobi experiment:
#
#   IMMACULATE_Q_GATEWAY_BASE_URL  e.g. http://127.0.0.1:8897/v1
#   IMMACULATE_Q_API_KEY           a Q API key issued by Immaculate
#
# An unset variable resolves to an empty string, and create_llm_client refuses to start without them.
# Rounds run only after the preflight in run_spec.template.yaml is confirmed by a person.

experiment_name: "immaculate_route_policy"

api:
  provider: "openai"
  base_url: "${IMMACULATE_Q_GATEWAY_BASE_URL}"
  api_key: "${IMMACULATE_Q_API_KEY}"
  model: "Q"

logging:
  wandb:
    # Keep experiment telemetry on the governed path; no third-party upload.
    enabled: false

pipeline:
  researcher:
    diff_based_evolution: true
    max_code_length: 20000
  engineer_timeout: 300
  sample_n: 3
