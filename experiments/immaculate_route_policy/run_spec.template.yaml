# Copy to .evolve_runs/immaculate-route-policy/run_spec.yaml (git-ignored) and complete the preflight.
# approval.confirmed stays false until a person reviews the preflight summary and confirms it.
objective: >-
  Maximize replayed routing fitness (performance - lambda_cost * cost / cost_reference) of the route
  order Immaculate uses for its governed fallbacks, per TaskClass x ComplexityBand, on the search fold,
  while beating the best single candidate.
evaluation:
  core_score: "fitness"
  secondary_metrics:
    - "uplift_vs_best_single"
    - "oracle_gap"
    - "performance"
    - "cost_per_1k_usd"
    - "second_choice_performance"
  command: "python3 experiments/immaculate_route_policy/evaluator.py {quoted_code_path} {quoted_results_path} --timeout-secs {timeout_secs}"
  script_path: "experiments/immaculate_route_policy/evaluator.py"
  timeout_secs: 120
  success_criteria:
    - "success is true"
    - "uplift_vs_best_single > 0 on the search fold"
    - "compile_table.py accepts the best program on the holdout fold"
budget:
  max_rounds: 40
  patience: 8
stop_conditions:
  - "no fitness improvement for `patience` rounds"
  - "oracle_gap below 0.01"
mutation_scope:
  writable_paths:
    - ".evolve_runs/immaculate-route-policy/"
  primary_targets:
    - "rank_candidates"
sampling:
  algorithm: "island"
  sample_n: 3
  feature_dimensions: ["complexity", "uplift_vs_best_single"]
  feature_bins: 10
  custom_sampler_path: ""
  custom_sampler_class: ""
cognition:
  source_mode: "seed_files"
  seed_files:
    - "experiments/immaculate_route_policy/cognition_seed.md"
  seed_notes: []
approval:
  confirmed: false
